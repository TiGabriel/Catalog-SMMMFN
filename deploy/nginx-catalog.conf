# /etc/nginx/sites-available/catalog – alternative to Caddy (certificates via certbot).
server {
    listen 80;
    server_name catalog.exemplu.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name catalog.exemplu.ro;

    ssl_certificate     /etc/letsencrypt/live/catalog.exemplu.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog.exemplu.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 3m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot inject addresses.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
